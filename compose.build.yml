# ---------------------------------------------------------------------------
# Override to BUILD the twocans images from source instead of pulling the
# prebuilt ones from Docker Hub. Merge it with the main compose file:
#
#   docker compose -f compose.yaml -f compose.build.yml up -d --build
#   # or:  make build
#
# The base file keeps `image:` (the published tag); this file adds `build:` so
# `docker compose` builds the images and re-tags them with that same name.
# The web image builds from the repo root (context `.`) because the app code in
# backend/ is baked into it; a root `.dockerignore` keeps secrets out of the build.
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
  whisper:
    build:
      context: ./docker/whisper
