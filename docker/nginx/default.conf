# ---------------------------------------------------------------------------
# HTTP — LAN access, and the place certbot proves it owns the domain.
#
# Deliberately not redirected to HTTPS: phones and browsers on the home network
# keep using plain http://<LAN>:8083, which must keep working without a
# certificate warning.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # certbot's HTTP-01 challenge is served straight from a shared directory the
    # nginx container watches; see entrypoint.sh.
    location ^~ /.well-known/acme-challenge/ {
        root /acme/challenge;
        default_type text/plain;
    }

    set $php_upstream php:9000;

    root /var/www/html;
    index index.php;

    client_max_body_size 4g;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;

        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 3600;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ ^/(src|views)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}

# ---------------------------------------------------------------------------
# HTTPS — the outside world (web UI over the dynamic DNS name).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $php_upstream php:9000;

    root /var/www/html;
    index index.php;

    client_max_body_size 4g;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;

        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 3600;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ ^/(src|views)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}

