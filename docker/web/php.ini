; twocans PHP settings.
; The compose file passes PHP_MEMORY_LIMIT / PHP_MAX_EXECUTION_TIME as env vars;
; php.ini cannot read those, so the pool config (www.conf) applies them instead.

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php-fpm/php-error.log

date.timezone = Europe/London

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Restoring a backup means uploading a tarball of recordings, which can run to
; gigabytes. Raise the PHP defaults (2M / 8M) so a real backup fits.
upload_max_filesize = 4G
post_max_size = 4G
