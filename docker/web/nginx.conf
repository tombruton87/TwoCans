# twocans web server — nginx serving static files and proxying PHP-FPM, which
# lives in the SAME container. FPM is reached over loopback, not a service name
# on the compose network, so there is no resolver / upstream variable to look up.
server {
    listen 80;
    server_name _;

    # certbot's HTTP-01 challenge is served from a shared directory; see
    # entrypoint.sh.
    location ^~ /.well-known/acme-challenge/ {
        root /acme/challenge;
        default_type text/plain;
    }

    root /var/www/html;
    index index.php;

    client_max_body_size 4g;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 3600;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ ^/(src|views)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}

# HTTPS — the outside world (web UI over the dynamic DNS name). Deliberately kept
# separate from HTTP on port 80, which stays for LAN access and certbot.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    root /var/www/html;
    index index.php;

    client_max_body_size 4g;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 3600;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ ^/(src|views)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
