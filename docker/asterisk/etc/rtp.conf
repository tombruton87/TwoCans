; Call audio's ports. Must match the range compose.yaml publishes, which is
; the same range on the host and in the container.
;
; 10000–10100 unless install.sh moved it (RTP_PORT_START/END in .env), when
; generated/rtp-ports.conf says so — and comes first, as the first of a
; setting is the one Asterisk takes.
[general]
#tryinclude "generated/rtp-ports.conf"
rtpstart = 10000
rtpend = 10100
