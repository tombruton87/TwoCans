; SIP NOTIFY messages twocans sends to the phones and adapters it sets up, by
; name — see Ami::notifyPhone(). res_pjsip_notify won't load without this file.
;
; check-sync: fetch the settings file again now, rather than at the next
; restart. With reboot=true: restart (fetching them on the way back up).
; The phone challenges these with its own account, so each Grandstream
; endpoint has outbound_auth — see PjsipConfig.

[twocans-resync]
Event => check-sync\;reboot=false

[twocans-reboot]
Event => check-sync\;reboot=true

; A Cisco SPA112 wants its own: resync (fetch the settings file again) and
; reboot. It challenges these with its line's account too.

[twocans-cisco-resync]
Event => resync

[twocans-cisco-reboot]
Event => reboot
