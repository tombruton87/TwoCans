; twocans module loading.
;
; We replaced the whole of /etc/asterisk with a minimal set, so autoload tries
; to start a lot of modules whose config files don't exist and logs an ERROR for
; each. Those errors are harmless but they drown out real ones, so anything this
; project will definitely never use is disabled explicitly below.
;
; Deliberately NOT disabled, because they're wanted later:
;   app_confbridge  — three-way "Join" mode in live listen-in (needs confbridge.conf)
;   res_parking     — not used yet, but cheap to keep
;   chan_pjsip / res_pjsip*  — the SIP stack itself
;   res_ari*        — call control from PHP
;   res_agi, app_mixmonitor  — call recording

[modules]
autoload = yes

; --- channel drivers we don't use ------------------------------------------
noload => chan_iax2.so
noload => chan_unistim.so
noload => chan_console.so

; --- alternate dialplan engines --------------------------------------------
noload => pbx_dundi.so
noload => pbx_ael.so

; --- realtime/database backends (we use MariaDB from PHP, not from Asterisk) -
noload => res_config_ldap.so
noload => res_config_pgsql.so
noload => res_config_sqlite3.so
noload => res_odbc.so

; --- CDR/CEL backends we don't write to ------------------------------------
noload => cdr_pgsql.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cdr_sqlite3_custom.so
noload => cel_pgsql.so
noload => cel_odbc.so
noload => cel_sqlite3_custom.so

; --- call-centre features, not a call centre -------------------------------
noload => app_agent_pool.so
noload => app_queue.so
noload => app_alarmreceiver.so
noload => app_followme.so
noload => app_amd.so

; --- monitoring / provisioning we handle ourselves -------------------------
noload => res_prometheus.so
noload => res_hep.so
noload => res_hep_rtcp.so
noload => res_hep_pjsip.so
noload => res_calendar.so
noload => res_clialiases.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so

; --- codec with a missing system library in this image ----------------------
noload => format_ogg_vorbis.so
