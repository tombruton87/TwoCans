; AMI, used for provisioning reloads.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[twocans]
; The password lives outside git: install.sh writes it from AMI_PASSWORD in .env.
#include "secrets/manager.conf"
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
permit = 10.0.0.0/255.0.0.0
read = system,call,log,verbose,agent,user,config,command,dtmf,reporting,cdr,dialplan
write = system,call,agent,user,config,command,reporting,originate
