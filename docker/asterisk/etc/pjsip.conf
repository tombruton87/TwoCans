; Transports and endpoints are both generated by the PHP backend from the
; database and from SIP_DOMAIN, into /etc/asterisk/generated.
;
; Nothing machine-specific is checked in here: the transports carry this host's
; LAN address, which differs on every install.
;
; A wildcard include that matches no files is fatal and takes the whole file
; down with it, so generated/ always keeps a placeholder.

#include generated/pjsip-*.conf
