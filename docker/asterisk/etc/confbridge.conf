; ConfBridge — three-way (and more) calls.
;
; app_confbridge ships with Asterisk but refuses to start without this file,
; which is why it showed as "Not Running" until now.
;
; The shape of a twocans conference is unusual: the child is not a conference
; participant in the normal sense, they are a kid on a phone who dialled one
; number and expects to be talking to two people. So there are no menus, no PINs
; and no admin keys — a DTMF menu is exactly the thing a five-year-old cannot
; use. Everything is arranged by the dialplan before anyone is connected.

[general]

; --------------------------------------------------------------- user profiles

[twocans_user]
type = user
; No announcements of any kind.
;
; announce_join_leave sounds like what we want — tell the child when Grandad
; arrives — but ConfBridge implements it by *recording each participant's name
; on the way in*: it plays vm-rec-name, waits for a beep, and admits them once
; they have spoken. That is the hotel-PBX ritual this product exists to avoid,
; and a grandparent who picks up the phone should simply be in the call.
;
; So there is nothing here. It sounds like an ordinary phone call, which is the
; point: when Grandma says hello, the child knows Grandma is there.
announce_join_leave = no
announce_user_count = no
announce_only_user = no
; Silence rather than hold music while waiting for the others to pick up: music
; on a handset sounds like the call went wrong.
music_on_hold_when_empty = no
; No menu. There is nothing for a participant to press.
dtmf_passthrough = no
quiet = no

; The grown-up who joins from the app to listen or step in. Identical to the
; above except they can arrive quietly, because announcing a parent joining
; would defeat the point of listening in.
[twocans_guardian]
type = user
announce_join_leave = no
announce_user_count = no
music_on_hold_when_empty = no
dtmf_passthrough = no
quiet = yes

; ------------------------------------------------------------- bridge profiles

[twocans_bridge]
type = bridge
; A family call, not a conference call. Small enough that a runaway loop can't
; turn into a twenty-way shouting match.
max_members = 6
; Mix at 8kHz — every leg is a narrowband handset, so there is nothing to gain
; from mixing higher and then throwing it away again.
internal_sample_rate = 8000
mixing_interval = 20
; Record the whole conference as one file. MixMonitor on a single channel would
; only capture that leg's view of it.
record_conference = yes
video_mode = none
