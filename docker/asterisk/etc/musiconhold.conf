; Music on hold: what the other person hears when a phone puts them on hold.
; res_musiconhold won't load without this file, and hold is then silence.
;
; The tracks are Asterisk's own Opsound set (CC-BY-SA 3.0; credits in NOTICE),
; which install.sh fetches into /var/lib/asterisk/moh — kept in the
; asterisk-lib volume, so an update doesn't lose them.

[default]
mode = files
directory = moh
sort = random

; The household's own music, uploaded on the Greetings screen: the "twocans"
; class, which the phones ask for once there's any (moh_suggest). Written by
; the web app — see HoldMusic.
#tryinclude "generated/musiconhold-custom.conf"
